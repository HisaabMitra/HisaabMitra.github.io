<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard Layout</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        flex-direction:column;
        overflow:hidden;
    }

    /* TOP HEADER */
    .header{
        height:60px;
        background:#0d6efd;
        color:white;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:0 20px;
        font-size:22px;
        font-weight:bold;
    }

    /* MAIN AREA */
    .container{
        flex:1;
        display:flex;
        overflow:hidden;
    }

    /* LEFT MENU */
    .sidebar{
        width:220px;
        background:#1e293b;
        color:white;
        padding-top:20px;
    }

    .sidebar button{
        width:100%;
        padding:15px;
        border:none;
        background:none;
        color:white;
        text-align:left;
        cursor:pointer;
        font-size:16px;
        transition:0.3s;
    }

    .sidebar button:hover{
        background:#334155;
    }

    /* MAIN CONTENT */
    .content{
        flex:1;
        padding:20px;
        background:#f1f5f9;
        overflow:auto;
    }

    .page{
        display:none;
        animation:fade 0.3s;
    }

    .active{
        display:block;
    }

    @keyframes fade{
        from{
            opacity:0;
            transform:translateY(10px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    /* BOTTOM MENU */
    .footer{
        height:55px;
        background:#0f172a;
        display:flex;
        justify-content:space-around;
        align-items:center;
        color:white;
    }

    .footer button{
        background:none;
        border:none;
        color:white;
        font-size:15px;
        cursor:pointer;
    }

    .footer button:hover{
        color:#38bdf8;
    }

    /* CARDS */
    .card{
        background:white;
        padding:20px;
        border-radius:10px;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
        margin-bottom:20px;
    }
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div>BCA PNB Garhi birbal</div>
    <div>Welcome Prince Arya</div>
</div>

<!-- MAIN -->
<div class="container">

    <!-- LEFT MENU -->
    <div class="sidebar">
        <button onclick="showPage('home')">🏠 Home</button>
        <button onclick="showPage('deposit')">💰 Deposit</button>
        <button onclick="showPage('withdrawal')">💳 Withdrawal</button>
        <button onclick="showPage('transfer')">🔄 Fund Transfer</button>
        <button onclick="showPage('report')">📊 Reports</button>
        <button onclick="showPage('settings')">⚙ Settings</button>
    </div>

    <!-- CONTENT -->
    <div class="content">

        <!-- HOME -->
        <div id="home" class="page active">
            <div class="card">
                <h2>Dashboard</h2>
                <p>Welcome to your dashboard.</p>
            </div>

            <div class="card">
                <h3>Today's Summary</h3>
                <p>Total Deposit : ₹50,000</p>
                <p>Total Withdrawal : ₹20,000</p>
            </div>
        </div>

      
  <!-- WITHDRAWAL -->
        <div id="withdrawal" class="page">
            <div class="card">
                <h2>Withdrawal Form</h2>

                <input type="text" placeholder="Account Number" style="width:100%;padding:10px;margin-top:10px;"><br><br>

                <input type="number" placeholder="Amount" style="width:100%;padding:10px;"><br><br>

                <button style="padding:10px 20px;background:#dc2626;color:white;border:none;border-radius:5px;">
                    Save Withdrawal
                </button>
            </div>
        </div>

        <!-- TRANSFER -->
        <div id="transfer" class="page">
            <div class="card">
                <h2>Fund Transfer</h2>

                <input type="text" placeholder="From Account" style="width:100%;padding:10px;margin-top:10px;"><br><br>

                <input type="text" placeholder="To Account" style="width:100%;padding:10px;"><br><br>

                <input type="number" placeholder="Amount" style="width:100%;padding:10px;"><br><br>

                <button style="padding:10px 20px;background:#2563eb;color:white;border:none;border-radius:5px;">
                    Transfer
                </button>
            </div>
        </div>

        <!-- REPORT -->
        <div id="report" class="page">
            <div class="card">
                <h2>Reports</h2>
                <p>Transaction reports will appear here.</p>
            </div>
        </div>

        <!-- SETTINGS -->
        <div id="settings" class="page">
            <div class="card">
                <h2>Settings</h2>
                <p>Website settings page.</p>
            </div>
        </div>

    </div>
</div>

<!-- FOOTER -->
<div class="footer">
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('deposit')">Deposit</button>
    <button onclick="showPage('withdrawal')">Withdrawal</button>
    <button onclick="showPage('report')">Reports</button>
</div>

<script>

function showPage(pageId){

    // Hide all pages
    let pages = document.querySelectorAll('.page');

    pages.forEach(function(page){
        page.classList.remove('active');
    });

    // Show selected page
    document.getElementById(pageId).classList.add('active');
}

</script>

</body>
</html>
