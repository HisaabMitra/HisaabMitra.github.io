<div class="container-fluid mt-4">
    <h2 class="mb-4">Aadhaar to Aadhaar Fund Transfer System</h2>
    
    <div class="row">
        <div class="col-md-6 border-end">
            <h4 class="text-primary">From (Remitter)</h4>
            <div class="mb-3">
                <label for="fromAadhaar" class="form-label">Aadhaar Number</label>
                <input type="text" id="fromAadhaar" class="form-control" maxlength="12" placeholder="Enter 12 digit Aadhaar">
                <div id="fromNameLabel" class="form-text text-success fw-bold mt-2"></div>
            </div>
        </div>

        <div class="col-md-6">
            <h4 class="text-success">To (Beneficiary)</h4>
            <div class="mb-3">
                <label for="toAadhaar" class="form-label">Aadhaar Number</label>
                <input type="text" id="toAadhaar" class="form-control" maxlength="12" placeholder="Enter 12 digit Aadhaar">
                <div id="toNameLabel" class="form-text text-success fw-bold mt-2"></div>
            </div>
        </div>
    </div>

    <hr>

    <div class="row mt-3">
        <div class="col-md-4 mb-3">
            <label for="transferAmount" class="form-label">Amount</label>
            <input type="number" id="transferAmount" class="form-control" placeholder="Enter Amount">
        </div>
        <div class="col-md-8 mb-3 align-self-end">
            <div id="amountInWords" class="alert alert-secondary py-2" style="min-height: 38px;">Amount in words...</div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 mb-3">
            <label for="transferRemarks" class="form-label">Remarks</label>
            <input type="text" id="transferRemarks" class="form-control" placeholder="Enter Remarks">
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-12">
            <button id="btnSaveTransfer" class="btn btn-primary btn-lg w-100">Save Transfer</button>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <h4>Recent Transfers</h4>
            <table class="table table-bordered table-striped" id="transferTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>From Aadhaar</th>
                        <th>To Aadhaar</th>
                        <th>Amount</th>
                        <th>Remarks</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="transferTableBody">
                    </tbody>
            </table>
        </div>
    </div>
</div>
