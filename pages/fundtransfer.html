<!-- pages/fundtransfer.html -->
<div class="module-page" id="fund-transfer-page">
    <div class="page-header">
        <h1>💸 Fund Transfer</h1>
        <p>Aadhaar to Aadhaar Money Transfer</p>
    </div>

    <div class="two-column-layout">
        
        <!-- Left: Transfer Form -->
        <div class="card">
            <h3>Transfer Details</h3>
            
            <div class="form-group">
                <label>From Aadhaar Number (Remitter)</label>
                <input type="text" id="ft-from-aadhaar" maxlength="12" class="input-field" placeholder="Enter 12 digit Aadhaar">
                <div id="ft-from-name-display" class="name-display"></div>
            </div>

            <div class="form-group">
                <label>To Aadhaar Number (Beneficiary)</label>
                <input type="text" id="ft-to-aadhaar" maxlength="12" class="input-field" placeholder="Enter 12 digit Aadhaar">
                <div id="ft-to-name-display" class="name-display"></div>
            </div>

            <div class="form-group">
                <label>Amount (₹)</label>
                <input type="number" id="ft-amount" class="input-field" placeholder="0.00">
                <div id="ft-amount-words" class="amount-words"></div>
            </div>

            <div class="form-group">
                <label>Remarks (Optional)</label>
                <input type="text" id="ft-remarks" class="input-field" placeholder="Fund transfer remarks">
            </div>

            <button id="btn-save-fund-transfer" class="btn-primary full-width">
                💾 SAVE FUND TRANSFER
            </button>
        </div>

        <!-- Right: Today's Ledger -->
        <div class="card">
            <h3>📋 Today's Fund Transfers</h3>
            <div class="table-container">
                <table class="data-table" id="ft-today-table">
                    <thead>
                        <tr>
                            <th>From → To</th>
                            <th>Amount</th>
                            <th>Time</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ft-today-ledger-body"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="js/fundtransfer/fundtransfer.js"></script>
