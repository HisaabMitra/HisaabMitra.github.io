<div id="jarvis-fundtransfer-wrapper" style="padding: 20px; max-width: 1100px; margin: 0 auto; font-family: sans-serif; text-align: left; box-sizing: border-box;">
    
    <div style="border-bottom: 3px solid #7d0022; padding-bottom: 12px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h2 style="color: #7d0022; margin: 0; font-size: 1.5rem; font-weight: bold;">💸 फंड ट्रांसफर गेटवे (Fund Transfer Hub)</h2>
            <p style="margin: 5px 0 0 0; color: #555; font-size: 0.88rem;">Execute intra-ledger terminal movements and peer-to-peer secure node distribution.</p>
        </div>
        <div id="ft-live-vault-indicator" style="background: #e9ecef; border: 1px solid #ced4da; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; color: #495057;">
            Vault Linked 🔗
        </div>
    </div>

    <div style="display: flex; gap: 25px; flex-wrap: wrap;">
        
        <div style="flex: 1.2; min-width: 400px; background: #ffffff; padding: 25px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #dee2e6; box-sizing: border-box;">
            
            <form id="form-jarvis-fundtransfer-master" onsubmit="return false;">
                
                <div style="margin-bottom: 18px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.85rem; color: #333;">Select Transfer Route:</label>
                    <div style="display: flex; gap: 10px;">
                        <button type="button" id="ft-route-account" class="ft-route-btn active" data-route="account" style="flex: 1; padding: 10px; background: #7d0022; color: white; border: 1px solid #7d0022; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85rem; transition: 0.2s;">To Account</button>
                        <button type="button" id="ft-route-aadhar" class="ft-route-btn" data-route="aadhar" style="flex: 1; padding: 10px; background: #e9ecef; color: #333; border: 1px solid #ced4da; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85rem; transition: 0.2s;">To Aadhaar</button>
                    </div>
                </div>

                <div style="margin-bottom: 15px;">
                    <label id="lbl-ft-destination-target" style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.85rem; color: #333;">Beneficiary Account Number:</label>
                    <input type="text" id="ft-destination-input" placeholder="Enter bank account number..." required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; box-sizing: border-box;">
                    
                    <div id="ft-live-telly-status-node" style="margin-top: 5px; font-size: 0.82rem; font-weight: bold; minimum-height: 18px;"></div>
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.85rem; color: #333;">Beneficiary Full Name:</label>
                    <input type="text" id="ft-beneficiary-name" placeholder="Name will auto-fetch or enter manually..." required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; box-sizing: border-box; background: #f8f9fa;">
                </div>

                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <div style="flex: 1;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.85rem; color: #333;">Transfer Amount (₹):</label>
                        <input type="number" id="ft-transfer-amount" placeholder="0.00" min="1" step="0.01" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; box-sizing: border-box; font-weight: bold;">
                    </div>
                    <div style="flex: 1.2;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.85rem; color: #333;">Remarks / Narration:</label>
                        <input type="text" id="ft-transfer-remarks" placeholder="Reason for transfer..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; box-sizing: border-box;">
                    </div>
                </div>

                <div id="ft-denomination-wrapper-node" class="hidden" style="margin-top: 20px; border-top: 2px dashed #7d0022; padding-top: 15px; flex-direction: column; gap: 10px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                        <span style="font-size: 0.9rem; font-weight: bold; color: #7d0022;">📊 Ledger Physical Denomination Adjustments</span>
                        <button type="button" id="btn-ft-bypass-denom" style="background: #6c757d; color: white; border: none; padding: 4px 8px; border-radius: 3px; font-size: 0.75rem; cursor: pointer;">Remove Denomination</button>
                    </div>
                    <div id="ft-injected-matrix-anchor">
                        </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 25px; border-top: 1px solid #dee2e6; padding-top: 18px;">
                    <button type="submit" id="btn-ft-master-submit" style="flex: 2; padding: 12px; background: #7d0022; color: #ffffff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.98rem; box-shadow: 0 2px 5px rgba(0,0,0,0.15); transition: 0.2s;">
                        🚀 Execute Fund Transfer
                    </button>
                    <button type="button" id="btn-ft-master-clear" style="flex: 1; padding: 12px; background: #e9ecef; color: #333; border: 1px solid #ced4da; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.95rem; transition: 0.2s;">
                        Reset
                    </button>
                </div>
            </form>
        </div>

        <div style="flex: 1; min-width: 350px; background: #ffffff; padding: 25px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #dee2e6; box-sizing: border-box; display: flex; flex-direction: column;">
            <div style="border-bottom: 2px solid #6c757d; padding-bottom: 10px; margin-bottom: 15px;">
                <h3 style="margin: 0; color: #333; font-size: 1.1rem; font-weight: bold;">📜 Recent Gateway Logs</h3>
            </div>
            <div id="ft-recent-logs-tbody" style="flex: 1; overflow-y: auto; max-height: 450px; font-size: 0.85rem; color: #555;">
                <div style="text-align: center; color: #999; font-style: italic; padding-top: 40px;">No recent ledger nodes loaded.</div>
            </div>
        </div>

    </div>
</div>
