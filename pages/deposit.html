<style>
    /* इनपुट बॉक्स से ऐरो हटाने के लिए */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    
    /* टेबल के लिए स्टाइल */
    .transaction-container { margin-top: 30px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .styled-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .styled-table th, .styled-table td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; font-size: 0.9rem; }
    .styled-table thead { background: #fdf2f4; }
</style>

<div class="deposit-wrapper" style="padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 style="color: #7d0022; margin: 0; font-size: 1.6rem; font-weight: 700;">💰 DEPOSIT ENTRY</h2>
        <span style="background: #fdf2f4; color: #7d0022; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; border: 1px solid #f9d5dc;">
            Counter KO Code: <strong id="lbl-ko-code">--</strong>
        </span>
    </div>
    <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 25px;">

    <div style="display: flex; gap: 30px; flex-wrap: wrap; align-items: flex-start;">
        <div style="flex: 1.1; min-width: 340px; display: flex; flex-direction: column; gap: 18px;">
            <div class="form-group">
                <label style="font-weight:600; color: #444; display:block; margin-bottom:6px; font-size:0.9rem;">Customer Account Number *</label>
                <input type="text" id="dep-account-no" placeholder="Enter Account Number" style="width:100%; padding: 11px 14px; font-size:1.1rem; font-weight:bold; border: 1px solid #dcdcdc; border-radius:6px; box-sizing: border-box;">
            </div>
            <div class="form-group">
                <label style="font-weight:600; color: #444; display:block; margin-bottom:6px; font-size:0.9rem;">Customer Name</label>
                <input type="text" id="dep-cust-name" placeholder="Name will auto-appear" readonly style="width:100%; padding: 11px 14px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius:6px; font-weight: bold; color: #7d0022; box-sizing: border-box;">
            </div>
            <div class="form-group">
                <label style="font-weight:600; color: #444; display:block; margin-bottom:6px; font-size:0.9rem;">Amount to Deposit (₹) *</label>
                <input type="number" id="dep-amount" placeholder="0.00" style="width:100%; padding: 11px 14px; font-size:1.2rem; font-weight:bold; color: #27ae60; border: 1px solid #dcdcdc; border-radius:6px; box-sizing: border-box;">
            </div>
            <div style="background: #fafafa; padding: 12px 15px; border: 1px solid #eaeaea; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
                <div style="flex: 1; padding-right: 10px;">
                    <span style="font-size: 0.75rem; color:#888; display:block; text-transform: uppercase; font-weight:700;">Amount in Words</span>
                    <strong id="dep-amount-words" style="color: #2c3e50; font-size: 0.9rem;">Zero Rupees Only</strong>
                </div>
                <button id="btn-speak-hindi" type="button" style="background: #7d0022; border:none; color:white; cursor:pointer; font-size:0.8rem; padding: 8px 12px; border-radius:6px; font-weight:600;">🔊 सुने</button>
            </div>
            <div class="form-group">
                <label style="font-weight:600; color: #444; display:block; margin-bottom:6px; font-size:0.9rem;">Remarks</label>
                <input type="text" id="dep-remarks" placeholder="Optional notes" style="width:100%; padding: 11px 14px; border: 1px solid #dcdcdc; border-radius:6px; box-sizing: border-box;">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="btn-dep-save" style="flex: 1; background: #7d0022; color:white; padding: 12px; font-weight:bold; cursor:pointer; border-radius:6px; border:none;">💾 Save</button>
                <button id="btn-dep-print" style="flex: 1; background: #2980b9; color:white; padding: 12px; font-weight:bold; cursor:pointer; border-radius:6px; border:none;" disabled>🖨️ Print</button>
                <button id="btn-dep-clear" style="flex: 0.9; background: #7f8c8d; color:white; padding: 12px; font-weight:bold; cursor:pointer; border-radius:6px; border:none;">🧹 Clear</button>
            </div>
        </div>

        <div id="denomination-widget-container" style="flex: 0.9; min-width: 320px; background: #fdfdfd; padding: 20px; border: 1px solid #eef0f2; border-radius: 8px;"></div>
    </div>
</div>

<div class="transaction-container">
    <h3 style="color: #444; margin-bottom: 15px;">Today's Transactions</h3>
    <table class="styled-table">
        <thead>
            <tr>
                <th>Account</th>
                <th>Name</th>
                <th>Amount</th>
                <th>Time</th>
            </tr>
        </thead>
        <tbody id="today-tx-body"></tbody>
    </table>
</div>

<div id="new-cust-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); z-index: 99999; align-items: center; justify-content: center;">
    <div style="background: white; padding: 25px; border-radius: 10px; max-width: 400px; width: 90%; border-top: 6px solid #7d0022;">
        <h3 style="color:#7d0022; margin-top:0;">New Customer Detected</h3>
        <input type="text" id="nc-account-no" readonly style="width:100%; padding:10px; margin-bottom:10px; background:#f8f9fa;">
        <input type="text" id="nc-name" placeholder="Full Name" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="tel" id="nc-mobile" placeholder="Mobile" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="text" id="nc-address" placeholder="Address" style="width:100%; padding:10px; margin-bottom:20px;">
        <div style="display: flex; gap:10px;">
            <button id="btn-nc-cancel" style="padding:10px; flex:1;">Cancel</button>
            <button id="btn-nc-continue" style="padding:10px; flex:1; background:#7d0022; color:white; border:none;">Register</button>
        </div>
    </div>
</div>
