<div id="jarvis-cash-manager-wrapper" style="display: block !important; padding: 20px; max-width: 1200px; margin: 0 auto; font-family: sans-serif; text-align: left; box-sizing: border-box;">
    
    <!-- 💼 MAIN HEADER PANEL -->
    <div style="border-bottom: 3px solid #7d0022; padding-bottom: 12px; margin-bottom: 25px; text-align: left;">
        <h2 style="color: #7d0022; margin: 0; font-size: 1.6rem; font-weight: bold;">💼 काउंटर कैश मैनेजर</h2>
        <p style="margin: 5px 0 0 0; color: #555; font-size: 0.9rem;">Manual cash adjustments and note exchange reconciliation hub.</p>
    </div>

    <!-- 🛠️ TWO-COLUMN SPLIT CONTAINER PANEL -->
    <div style="display: flex; gap: 25px; flex-wrap: wrap; align-items: flex-start; width: 100%;">
        
        <!-- 👈 LEFT SIDEBAR -->
        <div style="flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 15px;">
            <div style="background: #343a40; color: #ffffff; padding: 18px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-left: 5px solid #7d0022;">
                <span style="font-size: 0.8rem; text-transform: uppercase; color: #adb5bd; font-weight: bold; display: block; margin-bottom: 4px; letter-spacing: 0.5px;">कैश काउंटर कंट्रोल</span>
                <h3 style="margin: 0; font-size: 1.3rem; font-weight: bold; letter-spacing: 0.5px;">Physical Cash Vault</h3>
            </div>

            <div style="background: #ffffff; padding: 10px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #dee2e6; display: flex; flex-direction: column; gap: 8px;">
                <span style="font-size: 0.75rem; text-transform: uppercase; color: #6c757d; font-weight: bold; padding: 5px 10px; display: block; border-bottom: 1px dashed #eee; margin-bottom: 5px;">Operation Controls</span>
                
                <button type="button" class="cash-opt-btn" data-panel="adjust" style="width: 100%; text-align: left; padding: 14px 15px; background: #7d0022; color: #ffffff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; gap: 10px; transition: 0.2s;">
                    <span>💵</span> Cash In / Out Adjustment
                </button>
                
                <button type="button" class="cash-opt-btn" data-panel="exchange" style="width: 100%; text-align: left; padding: 14px 15px; background: #ffffff; color: #495057; border: 1px solid #ced4da; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; gap: 10px; transition: 0.2s;">
                    <span>🔄</span> Note Exchange (सुधार / अदला-बदली)
                </button>
            </div>
        </div>

        <!-- 👉 RIGHT PANEL -->
        <div style="flex: 1.5; min-width: 320px; max-width: 540px; display: flex; flex-direction: column;">
            
            <!-- 💵 WORKSPACE 1: CASH IN / OUT ADJUSTMENT FRAME -->
            <div id="panel-cash-adjust" class="cash-panel" style="display: block; background: #ffffff; padding: 22px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #7d0022; border: 1px solid #dee2e6; border-top-width: 5px; width: 100%; box-sizing: border-box;">
                <h3 style="margin-top: 0; margin-bottom: 15px; color: #7d0022; font-size: 1.15rem; font-weight: bold; border-bottom: 1px dashed #eee; padding-bottom: 10px;">💵 Cash In / Out Adjustment</h3>
                
                <div style="margin-bottom: 15px; width: 100%;">
                    <label style="display: block; font-weight: bold; font-size: 0.85rem; margin-bottom: 8px; color: #495057;">समायोजन का प्रकार (Adjustment Type)</label>
                    <select id="cash-adj-type" style="width: 100%; padding: 11px; border: 1px solid #ced4da; border-radius: 4px; font-weight: 600; font-size: 0.95rem; box-sizing: border-box;">
                        <option value="in" style="color: #27ae60; font-weight: bold;">➕ CASH IN (काउंटर पर कैश बढ़ाएं)</option>
                        <option value="out" style="color: #c0392b; font-weight: bold;">➖ CASH OUT (काउंटर से कैश घटाएं)</option>
                    </select>
                </div>

                <!-- Denomination grid injection spot -->
                <div id="cash-adj-denom-container" style="margin-top: 15px; background: #fafafa; padding: 12px; border-radius: 4px; border: 1px solid #eef0f2;"></div>

                <div style="display: flex; gap: 15px; justify-content: flex-end; margin-top: 20px; border-top: 1px dashed #dee2e6; padding-top: 15px;">
                    <button type="button" id="btn-cash-adj-save" style="width: 100%; padding: 12px; background: #7d0022; color: #ffffff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.95rem;">💾 Process Cash Adjustment</button>
                </div>
            </div>

            <!-- 🔄 WORKSPACE 2: NOTE EXCHANGE FRAME -->
            <div id="panel-cash-exchange" class="cash-panel" style="display: none; background: #ffffff; padding: 22px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #495057; border: 1px solid #dee2e6; border-top-width: 5px; width: 100%; box-sizing: border-box;">
                <h3 style="margin-top: 0; margin-bottom: 15px; color: #343a40; font-size: 1.15rem; font-weight: bold; border-bottom: 1px dashed #eee; padding-bottom: 10px;">🔄 Note Exchange Manager</h3>
                <p style="color: #6c757d; font-size: 0.8rem; margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 4px; border-left: 3px solid #6c757d; line-height: 1.4;">नोट सुधार या अदला-बदली: इसमें कुल नेट कैश का मूल्य **हमेशा ₹0** होना अनिवार्य है।</p>
                
                <div id="cash-exch-denom-container" style="margin-top: 15px; background: #fafafa; padding: 12px; border-radius: 4px; border: 1px solid #eef0f2;"></div>

                <div style="display: flex; gap: 15px; justify-content: flex-end; margin-top: 20px; border-top: 1px dashed #dee2e6; padding-top: 15px;">
                    <button type="button" id="btn-cash-exch-save" style="width: 100%; padding: 12px; background: #343a40; color: #ffffff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.95rem;">🔄 Execute Note Exchange</button>
                </div>
            </div>

        </div>
    </div>
</div>
