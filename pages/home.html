<div style="padding: 20px; font-family: 'Segoe UI', Arial, sans-serif;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #fdfdfd; padding: 15px; border-radius: 6px; border: 1px solid #eee;">
        <div>
            <h2 style="margin: 0; color: var(--color-maroon-main); font-size: 1.6rem;">Operational Workspace</h2>
            <p style="margin: 5px 0 0 0; color: #666; font-size: 0.9rem;">Real-time cash positions and settlement logs.</p>
        </div>
        <div style="text-align: right;">
            <span style="background: var(--color-maroon-main); color: white; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 0.9rem;" id="hp-ko-display">KO CODE: Loading...</span>
        </div>
    </div>

    <div style="background: linear-gradient(135deg, var(--color-maroon-main), var(--color-maroon-dark)); color: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); margin-bottom: 30px; position: relative; overflow: hidden;">
        <div style="position: absolute; right: -20px; bottom: -20px; font-size: 8rem; color: rgba(255,255,255,0.05); font-weight: bold; user-select: none;">₹</div>
        <p style="margin: 0; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; color: rgba(255,255,255,0.8);">Settlement Account Balance</p>
        <h1 style="margin: 10px 0 0 0; font-size: 2.8rem; font-weight: 700;" id="hp-settlement-balance">₹ 0.00</h1>
    </div>

    <h3 style="color: #333; border-bottom: 2px solid #eee; padding-bottom: 8px; margin-bottom: 20px; font-size: 1.1rem; display: flex; align-items: center; gap: 8px;">
        💵 Available Cash Vault & Denomination
    </h3>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 11fr)); gap: 15px;" id="denomination-grid">
        <div style="background: #fcf5ff; border: 1px solid #ebd3ff; padding: 15px; border-radius: 6px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02);">
            <div style="color: #b559ff; font-weight: bold; font-size: 1.2rem; margin-bottom: 5px;">₹ 2000</div>
            <div style="font-size: 1.4rem; font-weight: bold; color: #222;" id="note-count-2000">0</div>
            <small style="color: #888;">pieces</small>
        </div>

        <div style="background: #f5fbf7; border: 1px solid #d3eedb; padding: 15px; border-radius: 6px; text-align: center;">
            <div style="color: #27ae60; font-weight: bold; font-size: 1.2rem; margin-bottom: 5px;">₹ 500</div>
            <div style="font-size: 1.4rem; font-weight: bold; color: #222;" id="note-count-500">0</div>
            <small style="color: #888;">pieces</small>
        </div>

        <div style="background: #fffbf2; border: 1px solid #ffeec2; padding: 15px; border-radius: 6px; text-align: center;">
            <div style="color: #f2994a; font-weight: bold; font-size: 1.2rem; margin-bottom: 5px;">₹ 200</div>
            <div style="font-size: 1.4rem; font-weight: bold; color: #222;" id="note-count-200">0</div>
            <small style="color: #888;">pieces</small>
        </div>

        <div style="background: #f2f7ff; border: 1px solid #c2daff; padding: 15px; border-radius: 6px; text-align: center;">
            <div style="color: #2f80ed; font-weight: bold; font-size: 1.2rem; margin-bottom: 5px;">₹ 100</div>
            <div style="font-size: 1.4rem; font-weight: bold; color: #222;" id="note-count-100">0</div>
            <small style="color: #888;">pieces</small>
        </div>

        <div style="background: #f6fcfe; border: 1px solid #d2f0f8; padding: 15px; border-radius: 6px; text-align: center;">
            <div style="color: #00bcd4; font-weight: bold; font-size: 1.2rem; margin-bottom: 5px;">₹ 50</div>
            <div style="font-size: 1.4rem; font-weight: bold; color: #222;" id="note-count-50">0</div>
            <small style="color: #888;">pieces</small>
        </div>

        <div style="background: #fff5f5; border: 1px solid #ffd3d3; padding: 15px; border-radius: 6px; text-align: center;">
            <div style="color: #eb5757; font-weight: bold; font-size: 1.2rem; margin-bottom: 5px;">₹ 20</div>
            <div style="font-size: 1.4rem; font-weight: bold; color: #222;" id="note-count-20">0</div>
            <small style="color: #888;">pieces</small>
        </div>

        <div style="background: #f9f9f9; border: 1px solid #e0e0e0; padding: 15px; border-radius: 6px; text-align: center;">
            <div style="color: #666; font-weight: bold; font-size: 1.2rem; margin-bottom: 5px;">₹ 10</div>
            <div style="font-size: 1.4rem; font-weight: bold; color: #222;" id="note-count-10">0</div>
            <small style="color: #888;">pieces</small>
        </div>

        <div style="background: #fffdf2; border: 1px solid #ffeec2; padding: 15px; border-radius: 6px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02);">
            <div style="color: #d4af37; font-weight: bold; font-size: 1.2rem; margin-bottom: 5px;">🪙 Coins</div>
            <div style="font-size: 1.4rem; font-weight: bold; color: #222;" id="coin-total-count">0</div>
            <small style="color: #888;">total values</small>
        </div>
    </div>
</div>
