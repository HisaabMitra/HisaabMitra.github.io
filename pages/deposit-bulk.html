<style>
    /* बल्क ग्रिड टेबल के लिए विशेष स्टाइलिंग */
    .bulk-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
        margin-bottom: 20px;
    }
    .bulk-table th {
        background: #7d0022;
        color: white;
        padding: 12px 10px;
        font-weight: 600;
        text-align: left;
        font-size: 0.9rem;
    }
    .bulk-table td {
        padding: 10px 8px;
        border-bottom: 1px solid #eef0f2;
    }
    .bulk-input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 0.95rem;
        transition: border-color 0.2s;
    }
    .bulk-input:focus {
        border-color: #7d0022;
        outline: none;
    }
    .bulk-input[readonly] {
        background: #f8f9fa;
        color: #7d0022;
        font-weight: bold;
        cursor: not-allowed;
    }
</style>

<div style="background: #fafafa; padding: 15px; border: 1px solid #eaeaea; border-radius: 8px; display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 25px;">
    <div style="flex: 1; min-width: 250px;">
        <label style="font-weight:600; color: #444; display:block; margin-bottom:6px; font-size:0.85rem;">Depositor Full Name (जो पैसे काउंटर पर लाया है) *</label>
        <input type="text" id="bulk-depositor-name" placeholder="ENTER DEPOSITOR NAME" style="width: 100%; padding: 11px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()">
    </div>
    <div style="flex: 1; min-width: 250px;">
        <label style="font-weight:600; color: #444; display:block; margin-bottom:6px; font-size:0.85rem;">Depositor Mobile Number *</label>
        <input type="tel" id="bulk-depositor-mobile" placeholder="Enter 10 Digit Mobile Number" maxlength="10" style="width: 100%; padding: 11px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box;">
    </div>
</div>

<div style="display: flex; gap: 30px; flex-wrap: wrap; align-items: flex-start;">
    
    <div style="flex: 1.3; min-width: 450px; display: flex; flex-direction: column;">
        <table class="bulk-table">
            <thead>
                <tr>
                    <th style="width: 35%;">Account Number</th>
                    <th style="width: 35%;">Customer Name</th>
                    <th style="width: 20%;">Amount (₹)</th>
                    <th style="width: 10%; text-align: center;">Action</th>
                </tr>
            </thead>
            <tbody id="bulk-accounts-tbody">
                </tbody>
        </table>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
            <button type="button" id="btn-bulk-add-row" style="background: #f2994a; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; box-shadow: 0 2px 6px rgba(242,153,74,0.2); transition: background 0.2s;">
                ➕ Add Another Account Row
            </button>
            <div style="text-align: right; background: #eef7f2; padding: 8px 15px; border-radius: 6px; border: 1px solid #b8e2cb;">
                <span style="font-size: 0.75rem; color: #555; font-weight: bold; display: block; text-transform: uppercase;">Bulk Grand Total</span>
                <strong id="lbl-bulk-grand-total" style="font-size: 1.2rem; color: #27ae60;">₹0.00</strong>
            </div>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 35px; border-top: 1px solid #eee; padding-top: 20px;">
            <button id="btn-bulk-dep-save" type="button" class="btn" style="flex: 1.5; background: #7d0022; color:white; padding: 13px 5px; font-weight:bold; font-size:0.9rem; cursor:pointer; border-radius:6px; border:none; text-transform: uppercase; letter-spacing: 0.3px; box-shadow: 0 2px 6px rgba(125,0,34,0.2);">
                💾 Save Bulk Transactions (Ctrl + S)
            </button>
            <button id="btn-bulk-dep-clear" type="button" class="btn" style="flex: 0.8; background: #7f8c8d; color:white; padding: 13px 5px; font-weight:bold; font-size:0.9rem; cursor:pointer; border-radius:6px; border:none; text-transform: uppercase; letter-spacing: 0.3px;">
                🧹 Clear All
            </button>
        </div>
    </div>

    <div id="bulk-denomination-container" style="flex: 0.8; min-width: 320px; background: #fdfdfd; padding: 20px; border: 1px solid #eef0f2; border-radius: 8px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);">
        </div>
</div>

<div id="new-cust-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); backdrop-filter: blur(3px); z-index: 99999; align-items: center; justify-content: center;">
    <div style="background: white; padding: 25px 30px; border-radius: 10px; max-width: 400px; width: 90%; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border-top: 6px solid #7d0022;">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom: 8px;">
            <span style="font-size: 1.5rem;">🔍</span>
            <h3 style="color:#7d0022; margin:0; font-size:1.3rem; font-weight:700;">New Customer Detected</h3>
        </div>
        <p style="font-size:0.85rem; color:#666; margin-bottom:20px; line-height:1.4;">This account is not registered in the system. Complete the quick registration to proceed:</p>
        
        <div style="margin-bottom:14px;">
            <label style="font-size:0.8rem; font-weight:600; color:#555; display:block; margin-bottom:4px;">Account Number</label>
            <input type="text" id="nc-account-no" readonly style="width:100%; padding:10px; background:#f8f9fa; border:1px solid #e9ecef; border-radius:6px; font-weight:bold; box-sizing:border-box; color:#444;">
        </div>
        <div style="margin-bottom:14px;">
            <label style="font-size:0.8rem; font-weight:600; color:#555; display:block; margin-bottom:4px;">Customer Full Name *</label>
            <input type="text" id="nc-name" placeholder="Enter full name" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; font-size:0.9rem;">
        </div>
        <div style="margin-bottom:14px;">
            <label style="font-size:0.8rem; font-weight:600; color:#555; display:block; margin-bottom:4px;">Mobile Number *</label>
            <input type="tel" id="nc-mobile" placeholder="10-digit mobile number" maxlength="10" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; font-size:0.9rem;">
        </div>
        <div style="margin-bottom:22px;">
            <label style="font-size:0.8rem; font-weight:600; color:#555; display:block; margin-bottom:4px;">Address</label>
            <input type="text" id="nc-address" placeholder="City / Branch Area" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; font-size:0.9rem;">
        </div>
        
        <div style="display: flex; gap:12px; justify-content: flex-end;">
            <button id="btn-nc-cancel" type="button" style="padding:10px 16px; background:#f4f6f8; border:1px solid #ddd; color:#555; cursor:pointer; border-radius:6px; font-weight:600; font-size:0.85rem;">Cancel</button>
            <button id="btn-nc-continue" type="button" style="padding:10px 20px; background:#7d0022; color:white; border:none; cursor:pointer; border-radius:6px; font-weight:700; font-size:0.85rem;">Register & Continue</button>
        </div>
    </div>
</div>
